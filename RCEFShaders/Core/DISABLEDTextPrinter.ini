; Custom text printer for RCEFShaders. Uses the local Liberation Mono atlas.
namespace = RCEFText

; Caller inputs:
; Resource\RCEFText\Text  = an R8_UINT buffer containing ASCII text
; Resource\RCEFText\Color = required buffer containing R32_FLOAT R G B A
; Resource\RCEFText\Background = optional RGBA buffer; null disables fill
; Background fits the text block with 4px horizontal and 2px vertical
; padding at scale 1 / 1080p. Padding scales with the text.
; Text, Color and Background reset to null after every PrintText call, even if skipped.
; x99 = horizontal alignment point; y99 = top, normalized 0..1, Y increases downward
; z99 = horizontal alignment: 0 left, 1 center, 2 right
; w99 = scale multiplier: 1 gives a line height of 16/1080 of the viewport
; Each line starts at, centers on, or ends at x99. Explicit newlines only; no wrapping.
; Maximum 4096 bytes. NUL terminates text; CR is ignored; tabs use four spaces.
;
; Example inside a menu command list:
; Resource\RCEFText\Text = ref ResourceMenuTitle
; Resource\RCEFText\Color = ref ResourceMenuColorWhite
; x99 = $PanelPosX + 0.015
; y99 = $PanelPosY + 0.025
; Resource\RCEFText\Background = ref ResourceMenuColorYellow
; z99 = 0
; w99 = 1.2
; run = CommandList\RCEFText\PrintText
;
; [ResourceMenuTitle]
; type = Buffer
; format = R8_UINT
; data = "RCEFShaders"

[ResourceFont]
filename = Font/LiberationMono-Bold.dds

[ResourceText]

[ResourceBackground]

[ResourceColor]

[ResourceLayout]
type = StructuredBuffer
stride = 16
array = 4097

; Dimensions only: one byte per pixel, no backbuffer pixel copy.
[ResourceViewportSize]
type = Texture2D
format = R8_UNORM
array = 1
mips = 1
msaa = 1

[CommandListPrintText]
if ResourceText !== null && ResourceColor !== null && window_width > 0 && window_height > 0 && w99 > 0
    ResourceViewportSize = copy_description bb
    run = CustomShaderLayout
    run = CustomShaderDraw
endif
ResourceText = null
ResourceColor = null
ResourceBackground = null

[CustomShaderLayout]
cs = Shaders/DrawText.hlsl
cs-t1 = ref ResourceFont
cs-t2 = ref ResourceText
cs-u0 = ResourceLayout
dispatch = 1, 1, 1
cs-u0 = null
cs-t1 = null
cs-t2 = null

[CustomShaderDraw]
vs = Shaders/DrawText.hlsl
ps = Shaders/DrawText.hlsl
hs = null
ds = null
gs = null
cs = null
topology = triangle_list
cull = none
depth_enable = false
stencil_enable = false
scissor_enable = false
blend = ADD SRC_ALPHA INV_SRC_ALPHA
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport bb
vs-t1 = ref ResourceFont
ps-t1 = ref ResourceFont
vs-t3 = ResourceLayout
vs-t4 = ResourceViewportSize
vs-t2 = ref ResourceText
; Draw the optional padded background before the glyphs.
if ResourceBackground !== null
    run = CustomShaderBackground
endif
ps-cb0 = ref ResourceColor
draw = 24576, 0
vs-t1 = null
ps-t1 = null
vs-t3 = null
vs-t4 = null
vs-t2 = null
ps-cb0 = null

; Called with the font, layout, viewport and render target already bound.
; Nested custom shaders restore the text shaders before glyph rendering resumes.
[CustomShaderBackground]
vs = Shaders/DrawTextBG.hlsl
ps = Shaders/DrawTextBG.hlsl
ps-cb0 = ref ResourceBackground
draw = 6, 0