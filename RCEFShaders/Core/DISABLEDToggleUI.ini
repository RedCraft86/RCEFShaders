; For RCEFShaders

namespace = RCEFCore

[Constants]
global $MenuOpen = 0
global $DraggingMenu = 0
global $AllowDragging = 0
global $TexelSize = 16 / 1080

global $RatioY = 1
global persist $PanelPosX = 0.2
global persist $PanelPosY = 0.2
global $PanelSizeX = 0.4
global $PanelSizeY = 0.4
global $AnchorSizeX = 0.02
global $AnchorSizeY = 0.02

global $OffsetX = 0
global $OffsetY = 0
global $PaddingWidth = 0.01
global $PaddingHeight = 0.01
global $DividerSizeY = 0.002

; Cached padded button bounds in normalized viewport coordinates.
; Refreshed when drawn; use only while MenuOpen is true.
global $InvisWallsOffPosX = 0
global $InvisWallsOffPosY = 0
global $InvisWallsOffSizeX = 0
global $InvisWallsOffSizeY = 0
global $InvisWallsValleyPosX = 0
global $InvisWallsValleyPosY = 0
global $InvisWallsValleySizeX = 0
global $InvisWallsValleySizeY = 0
global $InvisWallsWulingPosX = 0
global $InvisWallsWulingPosY = 0
global $InvisWallsWulingSizeX = 0
global $InvisWallsWulingSizeY = 0

[KeyShowKeyInfo]
key = VK_MENU VK_END
type = cycle
$MenuOpen = 0, 1

[KeyRCEFMenuMouse]
condition = $AllowDragging
key = VK_LBUTTON
type = hold
$DraggingMenu = 1

[Present]
if $MenuOpen && window_width > 0 && window_height > 0
	$RatioY = window_width / window_height

	$AllowDragging = cursor_x >= $PanelPosX && cursor_x <= $PanelPosX + $AnchorSizeX && cursor_y >= $PanelPosY && cursor_y <= $PanelPosY + $AnchorSizeY * $RatioY
	if $DraggingMenu
		$PanelPosX = cursor_x
		$PanelPosY = cursor_y

		if $PanelPosX > 1 - $AnchorSizeX
			$PanelPosX = 1 - $AnchorSizeX
		endif
		if $PanelPosX < 0
			$PanelPosX = 0
		endif

		if $PanelPosY > 1 - ($AnchorSizeY * $RatioY)
			$PanelPosY = 1 - ($AnchorSizeY * $RatioY)
		endif
		if $PanelPosY < 0
			$PanelPosY = 0
		endif
	endif

	local $savedX99 = x99
	local $savedY99 = y99
	local $savedZ99 = z99
	local $savedW99 = w99

	run = CustomShaderDrawMenuBase
	run = CommandListMenuTitle
	run = CustomShaderDrawDivider
	run = CommandListAICModeSection
	run = CustomShaderDrawDivider
	run = CommandListInvisWallsSection

	x99 = $savedX99
	y99 = $savedY99
	z99 = $savedZ99
	w99 = $savedW99
else
	$AllowDragging = 0
endif

[ResourceMenuColorWhite]
type = Buffer
data = R32_FLOAT 1 1 1 1

[ResourceMenuColorBlack]
type = Buffer
data = R32_FLOAT 0 0 0 1

[ResourceMenuColorYellow]
type = Buffer
data = R32_FLOAT 1 1 0 1

[ResourceMenuColorBackground]
type = Buffer
data = R32_FLOAT 0.08 0.08 0.08 0.75

[ResourceMenuColorDivider]
type = Buffer
data = R32_FLOAT 0.5 0.5 0.5 1

[CustomShaderDrawMenuBase]
vs = Shaders/Draw2D.hlsl
ps = Shaders/Draw2D.hlsl
hs = null
ds = null
gs = null

cull = none
topology = triangle_strip
blend = ADD SRC_ALPHA INV_SRC_ALPHA
o0 = set_viewport bb

x99 = $PanelPosX
y99 = $PanelPosY
z99 = $PanelSizeX
w99 = $PanelSizeY * $RatioY
ps-cb0 = ref ResourceMenuColorBackground
ps-t1 = null
draw = 4, 0

z99 = $AnchorSizeX
w99 = $AnchorSizeY * $RatioY
ps-cb0 = ref ResourceMenuColorWhite
ps-t1 = null
draw = 4, 0

$OffsetY = $PanelPosY

[CustomShaderDrawDivider]
vs = Shaders/Draw2D.hlsl
ps = Shaders/Draw2D.hlsl
hs = null
ds = null
gs = null

cull = none
topology = triangle_strip
blend = ADD SRC_ALPHA INV_SRC_ALPHA
o0 = set_viewport bb

x99 = $PanelPosX
y99 = $OffsetY
z99 = $PanelSizeX
w99 = $DividerSizeY * $RatioY
ps-cb0 = ref ResourceMenuColorDivider
ps-t1 = null
draw = 4, 0

$OffsetY = $OffsetY + w99 + ($PaddingHeight * $RatioY)

[CommandListDrawDefaultText]
Resource\RCEFText\Background = null
Resource\RCEFText\Color = ref ResourceMenuColorWhite
run = CommandList\RCEFText\PrintText

[CommandListDrawSelectedText]
Resource\RCEFText\Background = ref ResourceMenuColorYellow
Resource\RCEFText\Color = ref ResourceMenuColorBlack
run = CommandList\RCEFText\PrintText

[ResourceMenuTitle]
type = Buffer
format = R8_UINT
data = "RCEFShaders"

[CommandListMenuTitle]
x99 = $PanelPosX + ($PanelSizeX / 2)
y99 = $PanelPosY + ($AnchorSizeY / 4) * $RatioY
z99 = 1
w99 = 2
Resource\RCEFText\Text = ref ResourceMenuTitle
Resource\RCEFText\Color = ref ResourceMenuColorYellow
Resource\RCEFText\Background = null
run = CommandList\RCEFText\PrintText

$OffsetY = $OffsetY + ($TexelSize * w99) + ($PaddingHeight * $RatioY)

[ResourceAICModeSectionText]
type = Buffer
format = R8_UINT
data = "AIC Mode"

[CommandListAICModeSection]
x99 = $PanelPosX + ($AnchorSizeX / 2)
y99 = $OffsetY
z99 = 0
w99 = 1.5
Resource\RCEFText\Text = ref ResourceAICModeSectionText
run = CommandListDrawDefaultText

$OffsetX = $PanelPosX + $AnchorSizeX
$OffsetY = $OffsetY + ($TexelSize * w99) + ($PaddingHeight * $RatioY)

[ResourceInvisWallsSectionText]
type = Buffer
format = R8_UINT
data = "Invisible Walls"

[CommandListInvisWallsSection]
x99 = $PanelPosX + ($AnchorSizeX / 2)
y99 = $OffsetY
z99 = 0
w99 = 1.5
Resource\RCEFText\Text = ref ResourceInvisWallsSectionText
run = CommandListDrawDefaultText

$OffsetX = $PanelPosX + $AnchorSizeX
$OffsetY = $OffsetY + ($TexelSize * w99) + ($PaddingHeight * $RatioY)

; Text buttons at scale 1.5. OffsetX/Y identify the padded button's top-left.
; Monospace advance at the 16px reference line height: 16 * 0.75 = 12px.
; The text printer adds 4 pixels on each side and 2 above/below.
local $buttonCharWidth = 16 * 0.75
local $buttonUnitY = 1.5 / 1080
local $buttonUnitX = $buttonUnitY / $RatioY

$InvisWallsOffPosX = $OffsetX
$InvisWallsOffPosY = $OffsetY
$InvisWallsOffSizeX = (3 * $buttonCharWidth + 8) * $buttonUnitX
$InvisWallsOffSizeY = (16 + 4) * $buttonUnitY

x99 = $InvisWallsOffPosX + 4 * $buttonUnitX
y99 = $InvisWallsOffPosY + 2 * $buttonUnitY
z99 = 0
w99 = 1.5
Resource\RCEFText\Text = ref ResourceInvisWallsOffText
if $\RCEFShaders\ShowInvisWalls == 0
    run = CommandListDrawSelectedText
else
    run = CommandListDrawDefaultText
endif
$OffsetX = $InvisWallsOffPosX + $InvisWallsOffSizeX + $PaddingWidth

$InvisWallsValleyPosX = $OffsetX
$InvisWallsValleyPosY = $OffsetY
$InvisWallsValleySizeX = (8 * $buttonCharWidth + 8) * $buttonUnitX
$InvisWallsValleySizeY = (16 + 4) * $buttonUnitY

x99 = $InvisWallsValleyPosX + 4 * $buttonUnitX
y99 = $InvisWallsValleyPosY + 2 * $buttonUnitY
z99 = 0
w99 = 1.5
Resource\RCEFText\Text = ref ResourceInvisWallsValleyText
if $\RCEFShaders\ShowInvisWalls == 1
    run = CommandListDrawSelectedText
else
    run = CommandListDrawDefaultText
endif
$OffsetX = $InvisWallsValleyPosX + $InvisWallsValleySizeX + $PaddingWidth

$InvisWallsWulingPosX = $OffsetX
$InvisWallsWulingPosY = $OffsetY
$InvisWallsWulingSizeX = (6 * $buttonCharWidth + 8) * $buttonUnitX
$InvisWallsWulingSizeY = (16 + 4) * $buttonUnitY

x99 = $InvisWallsWulingPosX + 4 * $buttonUnitX
y99 = $InvisWallsWulingPosY + 2 * $buttonUnitY
z99 = 0
w99 = 1.5
Resource\RCEFText\Text = ref ResourceInvisWallsWulingText
if $\RCEFShaders\ShowInvisWalls == 2
    run = CommandListDrawSelectedText
else
    run = CommandListDrawDefaultText
endif
$OffsetX = $InvisWallsWulingPosX + $InvisWallsWulingSizeX + $PaddingWidth
$OffsetY = $InvisWallsWulingPosY + $InvisWallsWulingSizeY + ($PaddingHeight * $RatioY)

[ResourceInvisWallsOffText]
type = Buffer
format = R8_UINT
data = "Off"

[ResourceInvisWallsValleyText]
type = Buffer
format = R8_UINT
data = "Valley 4"

[ResourceInvisWallsWulingText]
type = Buffer
format = R8_UINT
data = "Wuling"
; Sample: click the cached Invisible Walls button bounds.
; Uncomment the sections below to enable. The default key binding runs once
; per press. Bounds include text padding and already use cursor_x/y's space.
; Do not multiply the cached Y positions or sizes by RatioY again.
;
[KeyInvisWallsButtonClick]
key = VK_LBUTTON
condition = $MenuOpen && !$DraggingMenu && !$AllowDragging
run = CommandListInvisWallsButtonClick

[CommandListInvisWallsButtonClick]
if $MenuOpen && !$DraggingMenu && !$AllowDragging
    if cursor_x >= $InvisWallsOffPosX && cursor_x < $InvisWallsOffPosX + $InvisWallsOffSizeX && cursor_y >= $InvisWallsOffPosY && cursor_y < $InvisWallsOffPosY + $InvisWallsOffSizeY
        $\RCEFShaders\ShowInvisWalls = 0
    elif cursor_x >= $InvisWallsValleyPosX && cursor_x < $InvisWallsValleyPosX + $InvisWallsValleySizeX && cursor_y >= $InvisWallsValleyPosY && cursor_y < $InvisWallsValleyPosY + $InvisWallsValleySizeY
        $\RCEFShaders\ShowInvisWalls = 1
    elif cursor_x >= $InvisWallsWulingPosX && cursor_x < $InvisWallsWulingPosX + $InvisWallsWulingSizeX && cursor_y >= $InvisWallsWulingPosY && cursor_y < $InvisWallsWulingPosY + $InvisWallsWulingSizeY
        $\RCEFShaders\ShowInvisWalls = 2
    endif
endif
