; ge r0\.y, r0\.y, cb\d+\[\d+\]\.x.*?
; and r0\.y, r0\.y, l\(0x3f800000\).*?
; mad r0\.x, -r0\.y, cb\d+\[\d+\]\.[zw], r0\.x


