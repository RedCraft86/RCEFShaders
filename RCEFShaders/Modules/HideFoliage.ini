; add r0\.y, -r0\.y, l\(1\.000000\).*?
; dp3 r0\.z, cb\d+\[r0\.x \+ 3\]\.xyzx, cb\d+\[r0\.x \+ 3\]\.xyzx.*?
; sqrt r0\.z, r0\.z.*?
; mul r0\.z, r0\.z, cb\d+\[4\]\.y.*?
