; Sub-Mod for RCEFShaders 1.5

; Feature Impl -----------------------------

[ResourceDistCullRange]
type = Buffer
format = R32G32B32A32_FLOAT
data = 30.0   0 0 0
;       ^     ^^^^^- Padding
;       ^- Cull Range


[Constants]
global $CullRange = 0
global $CullSpeed = 1
global $HoldUp = 0
global $HoldDown = 0
global $FrameCounter = 0


[ResourceCullSpeed_1]
type = Buffer
data = "1"
[ResourceCullSpeed_10]
type = Buffer
data = "10"
[ResourceCullSpeed_100]
type = Buffer
data = "100"
[ResourceCullSpeed_1000]
type = Buffer
data = "1000"

[ResourceCullSpeedParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT  +0.60 +0.65 +0.98 +0.70   1.00 0.20 0.20 1.00   0.00 0.00 0.00 0.90   0.01  0.01   2 2   0   1.3
;                x1-^  y1-^  x2-^  y2-^   | R-^  G-^  B-^  A-^  | R-^  G-^  B-^  A-^  | ^-H    V-^ | ^ ^ | ^ |  ^- font scale
;                Rectangle (range -1:+1)  | Text Color          | Background Color    | Border     |  ^  | ^- text alignment: 0=left 1=center 2=right
;   

[CommandListShowSpeed]
if $CullSpeed == 1
	Resource\EFMIv1\Text = ref ResourceCullSpeed_1
else if $CullSpeed == 10
	Resource\EFMIv1\Text = ref ResourceCullSpeed_10
else if $CullSpeed == 100
	Resource\EFMIv1\Text = ref ResourceCullSpeed_100
else if $CullSpeed == 1000
	Resource\EFMIv1\Text = ref ResourceCullSpeed_1000
endif
Resource\EFMIv1\TextParams = ref ResourceCullSpeedParams
run = CommandList\EFMIv1\PrintText

[KeyCullRangeUp]
key = VK_ADD
type = hold
$HoldUp = 1

[KeyCullRangeDown]
key = VK_SUBTRACT
type = hold
$HoldDown = 1

[KeyCullRangeReset]
key = VK_ENTER
$CullRange = 0

[KeyCullRangeSpeed]
key = VK_MULTIPLY
type = cycle
$CullSpeed = 1, 10

[Present]
if $\RCEFShaders\HideFoliage == 2
	$FrameCounter = $FrameCounter + 1
	if $FrameCounter >= 2
		$FrameCounter = 0
		if $HoldUp == 1
			$CullRange = $CullRange + $CullSpeed
		endif
		if $HoldDown == 1
			$CullRange = $CullRange - $CullSpeed
		endif
	endif

	if $CullRange < 0
		$CullRange = 0
	endif
	x186 = $CullRange
	run = CommandListShowSpeed
endif

