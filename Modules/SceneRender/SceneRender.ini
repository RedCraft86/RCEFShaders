; Remove Deferred Fog ----------------------

[ResourceOriginalCB]

[ResourceFogInputCB]
type = Buffer
bind_flags = constant_buffer

[ResourcePatchedCB]
type = Buffer
bind_flags = constant_buffer
byte_width = 2560

[ResourceFogScratch]
type = RWBuffer
format = R32G32B32A32_UINT
byte_width = 2560
array = 160

[CustomShaderRemoveFog]
cs = RemoveFog.hlsl
cs-cb0 = ref ResourceFogInputCB
cs-u0 = ref ResourceFogScratch
dispatch = 3, 1, 1
cs-u0 = null
cs-cb0 = null
ResourcePatchedCB = copy ResourceFogScratch

[CommandListDeferredRemoveFog]
ResourceOriginalCB = ref ps-cb1
ResourceFogInputCB = copy ps-cb1
run = CustomShaderRemoveFog
ps-cb1 = ref ResourcePatchedCB
post ps-cb1 = ref ResourceOriginalCB

