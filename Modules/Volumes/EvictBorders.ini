; Feature Module of RCEFShaders

namespace = RCEFShaders\EvictBorders

; Feature Impl -----------------------------

[Constants]
; Hide further volume surfaces that are behind closer volume surfaces
global $selfDepthTest = 1

[CommandListRender]
if $\RCEFCore\EvictBorders && $\RCEFCore\InGameWorld && $\RCEFLibrary\HasValidViewport && bb !== null
	if $selfDepthTest
		run = CommandListPrepSelfDepth
		if ResourceSelfDepth !== null
			run = CustomShaderEvictBordersDepth
			run = CustomShaderEvictBorders
		endif
	else
		run = CustomShaderEvictBorders
	endif
endif

; Private depth for self-occlusion ---------

[ResourceSelfDepth]
format = DXGI_FORMAT_D32_FLOAT
bind_flags = depth_stencil
array = 1
mips = 1
msaa = 1

[CommandListPrepSelfDepth]
; Match the backbuffer size, including after a resolution change.
ResourceSelfDepth = copy_description bb
if ResourceSelfDepth !== null
	; Reversed Z: zero is farthest. Never clear the game's scene depth.
	clear = ResourceSelfDepth depth 0.0
endif

; Render volume geometry -------------------

[ResourceZoneDataX]
type = Buffer
data = R32_FLOAT 1.0 0.0 0.0  0.2
;                 ^   ^   ^    ^- Opacity
;                 R   G   B  Color [0..1]
; X-Axis Facing Color

[ResourceZoneDataY]
type = Buffer
data = R32_FLOAT 0.0 1.0 0.0  0.2
;                 ^   ^   ^    ^- Opacity
;                 R   G   B  Color [0..1]
; Y-Axis Facing Color

[ResourceZoneDataZ]
type = Buffer
data = R32_FLOAT 0.0 0.0 1.0  0.2
;                 ^   ^   ^    ^- Opacity
;                 R   G   B  Color [0..1]
; Z-Axis Facing Color

[ResourceZoneIB_Map01]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\EvictBorders_Map01_IB.buf

[ResourceZoneVB_Map01]
type = Buffer
stride = 20
filename = Meshes\EvictBorders_Map01_VB.buf

[ResourceZoneEdges_Map01]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\EvictBorders_Map01_Edges.buf

[ResourceZoneIB_Map02]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\EvictBorders_Map02_IB.buf

[ResourceZoneVB_Map02]
type = Buffer
stride = 20
filename = Meshes\EvictBorders_Map02_VB.buf

[ResourceZoneEdges_Map02]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\EvictBorders_Map02_Edges.buf

[CustomShaderEvictBordersDepth]
vs = ..\..\Core\Shaders\DrawBorder.hlsl
ps = ..\..\Core\Shaders\DrawBorder.hlsl
cs = null
ds = null
gs = null
hs = null
cull = none
topology = triangle_list
blend = ADD ZERO ONE
alpha = ADD ZERO ONE
mask = 0
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
oD = ref ResourceSelfDepth
run = CommandListDrawZones

[CustomShaderEvictBorders]
vs = ..\..\Core\Shaders\DrawBorder.hlsl
ps = ..\..\Core\Shaders\DrawBorder.hlsl
cs = null
ds = null
gs = null
hs = null
cull = none
topology = triangle_list
blend = ADD SRC_ALPHA INV_SRC_ALPHA
mask = 0xf
depth_enable = true
depth_write_mask = zero
depth_func = equal
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
if $selfDepthTest
	oD = ref ResourceSelfDepth
else
	oD = null
endif
run = CommandListDrawZones

[CommandListDrawZones]
vs-cb0 = ref Resource\RCEFLibrary\CameraCB
ps-t1 = ref Resource\RCEFLibrary\ViewportSize
ps-t2 = ref Resource\RCEFLibrary\SceneDepth
ps-cb0 = ref ResourceZoneDataX
ps-cb1 = ref ResourceZoneDataY
ps-cb2 = ref ResourceZoneDataZ

if $\RCEFCore\ActiveMap == 1
	vb0 = ref ResourceZoneVB_Map01
	ib = ref ResourceZoneIB_Map01
	ps-t3 = ref ResourceZoneEdges_Map01
	drawindexed = 582, 0, 0
else if $\RCEFCore\ActiveMap == 2
	vb0 = ref ResourceZoneVB_Map02
	ib = ref ResourceZoneIB_Map02
	ps-t3 = ref ResourceZoneEdges_Map02
	drawindexed = 1758, 0, 0
endif