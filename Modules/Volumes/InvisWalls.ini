; Feature Module of RCEFShaders

namespace = RCEFShaders\InvisWalls

; Feature Impl -----------------------------

[Constants]
; Hide further volume surfaces that are behind closer volume surfaces
global $selfDepthTest = 0

[CommandListRender]
if $\RCEFCore\InvisWalls && $\RCEFCore\InGameWorld && $\RCEFLibrary\HasValidViewport && bb !== null
	if $selfDepthTest
		run = CommandListPrepSelfDepth
		if ResourceSelfDepth !== null
			run = CustomShaderInvisWallsDepth
			run = CustomShaderInvisWalls
		endif
	else
		run = CustomShaderInvisWalls
	endif
endif

; Private depth for self-occlusion ---------

[ResourceSelfDepth]
format = DXGI_FORMAT_D32_FLOAT
bind_flags = depth_stencil
array = 1
mips = 1
msaa = 1

[CommandListPrepSelfDepth]
; Match the backbuffer size, including after a resolution change.
ResourceSelfDepth = copy_description bb
if ResourceSelfDepth !== null
	; Reversed Z: zero is farthest. Never clear the game's scene depth.
	clear = ResourceSelfDepth depth 0.0
endif

; Render volume geometry -------------------

[ResourceWallData]
type = Buffer
data = R32_FLOAT 0.0 1.0 1.0  400.0
;                 ^   ^   ^   ^- Max Distance (0 for no limit)
;                 R   G   B  Color [0..1]

[ResourceWallIB_Map01]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\InvisWalls_Map01_IB.buf

[ResourceWallVB_Map01]
type = Buffer
stride = 20
filename = Meshes\InvisWalls_Map01_VB.buf

[ResourceWallEdges_Map01]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\InvisWalls_Map01_Edges.buf

[ResourceWallIB_Map02]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\InvisWalls_Map02_IB.buf

[ResourceWallVB_Map02]
type = Buffer
stride = 20
filename = Meshes\InvisWalls_Map02_VB.buf

[ResourceWallEdges_Map02]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\InvisWalls_Map02_Edges.buf

[CustomShaderInvisWallsDepth]
vs = ..\..\Core\Shaders\DrawVolume.hlsl
ps = ..\..\Core\Shaders\DrawVolume.hlsl
cs = null
ds = null
gs = null
hs = null
cull = front
topology = triangle_list
blend = ADD ZERO ONE
alpha = ADD ZERO ONE
mask = 0
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
oD = ref ResourceSelfDepth
run = CommandListDrawWalls

[CustomShaderInvisWalls]
vs = ..\..\Core\Shaders\DrawVolume.hlsl
ps = ..\..\Core\Shaders\DrawVolume.hlsl
cs = null
ds = null
gs = null
hs = null
cull = front
topology = triangle_list
blend = ADD SRC_ALPHA INV_SRC_ALPHA
mask = 0xf
depth_enable = true
depth_write_mask = zero
depth_func = equal
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
if $selfDepthTest
	oD = ref ResourceSelfDepth
else
	oD = null
endif
run = CommandListDrawWalls

[CommandListDrawWalls]
vs-cb0 = ref Resource\RCEFLibrary\CameraCB
ps-t1 = ref Resource\RCEFLibrary\ViewportSize
ps-t2 = ref Resource\RCEFLibrary\SceneDepth
ps-cb0 = ref ResourceWallData

if $\RCEFCore\ActiveMap == 1
	vb0 = ref ResourceWallVB_Map01
	ib = ref ResourceWallIB_Map01
	ps-t3 = ref ResourceWallEdges_Map01
	drawindexed = 121536, 0, 0
else if $\RCEFCore\ActiveMap == 2
	vb0 = ref ResourceWallVB_Map02
	ib = ref ResourceWallIB_Map02
	ps-t3 = ref ResourceWallEdges_Map02
	drawindexed = 231588, 0, 0
endif
