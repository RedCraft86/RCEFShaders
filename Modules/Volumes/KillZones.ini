; Feature Module of RCEFShaders

namespace = RCEFShaders\KillZones

; Feature Impl -----------------------------

[CommandListRender]
if $\RCEFCore\KillZones && $\RCEFCore\InGameWorld && $\RCEFLibrary\HasValidViewport
	run = CustomShaderKillZones
endif

; Render kill zones ------------------------

[ResourceZoneData]
type = Buffer
data = R32_FLOAT 1.0 0.0 0.0  400.0
;                 ^   ^   ^   ^- Max Distance (0 for no limit)
;                 R   G   B  Color

[ResourceZoneIB_Map01]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\KillZones_Map01_IB.buf

[ResourceZoneVB_Map01]
type = Buffer
stride = 20
filename = Meshes\KillZones_Map01_VB.buf

[ResourceZoneIB_Map02]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes\KillZones_Map02_IB.buf

[ResourceZoneVB_Map02]
type = Buffer
stride = 20
filename = Meshes\KillZones_Map02_VB.buf

[CustomShaderKillZones]
vs = ..\..\Core\Shaders\DrawVolume.hlsl
ps = ..\..\Core\Shaders\DrawVolume.hlsl
cs = null
ds = null
gs = null
hs = null
cull = front
topology = triangle_list
blend = ADD SRC_ALPHA INV_SRC_ALPHA
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb

vs-cb0 = ref Resource\RCEFLibrary\CameraCB
ps-t1 = ref Resource\RCEFLibrary\ViewportSize
ps-t2 = ref Resource\RCEFLibrary\SceneDepth
ps-cb0 = ref ResourceZoneData

if $\RCEFCore\ActiveMap == 1
	vb0 = ref ResourceZoneVB_Map01
	ib = ref ResourceZoneIB_Map01
	drawindexed = 6756, 0, 0
else if $\RCEFCore\ActiveMap == 2
	vb0 = ref ResourceZoneVB_Map02
	ib = ref ResourceZoneIB_Map02
	drawindexed = 6048, 0, 0
endif