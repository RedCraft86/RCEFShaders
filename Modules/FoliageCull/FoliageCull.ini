; Feature Module of RCEFShaders

namespace = RCEFShaders\FoliageCull

; Feature Impl -----------------------------

[Constants]
; Shadow Culling
; 0 = Never cull
; 1 = Cull when FoliageMode == 1
; 2 = Cull when FoliageMode != 0
global $CullShadows = 1

[ResourceDistCullRange]
type = Buffer
data = R32_FLOAT 30  15  0 0
;                ^   ^   ^^^- Padding (unused)
;                ^   ^- Grass Cull Range [0..inf]
;                ^- Tree/Bush Cull Range [0..inf]

; Shadows ----------------------------------

[CommandListCullShadows]
if $\EFMIv1\enable_mods && (($CullShadows == 1 && $\RCEFCore\FoliageMode == 1) || ($CullShadows == 2 && $\RCEFCore\FoliageMode != 0))
	handling = skip
endif

