; Misc Menu Section of RCEFShaders

namespace = RCEFMenu\Misc

; Hitbox state -----------------------------

[Constants]
global $MinY = 0
global $MaxY = 0

global $MinX_Unlit = 0
global $MaxX_Unlit = 0

global $MinX_HideUI = 0
global $MaxX_HideUI = 0

global $MinX_Coordinates = 0
global $MaxX_Coordinates = 0

; Click handling ---------------------------

[KeySelectMode]
condition = $\RCEFMenu\IsOpen
key = VK_LBUTTON
run = CommandListMakeSelection

[CommandListMakeSelection]
if cursor_y >= $MinY && cursor_y <= $MaxY
	if cursor_x >= $MinX_Unlit && cursor_x <= $MaxX_Unlit
		$\RCEFCore\UnlitView = !$\RCEFCore\UnlitView
	elif cursor_x >= $MinX_HideUI && cursor_x <= $MaxX_HideUI
		$\RCEFCore\HideGameUI = !$\RCEFCore\HideGameUI
	elif cursor_x >= $MinX_Coordinates && cursor_x <= $MaxX_Coordinates
		$\RCEFCore\Coordinates = !$\RCEFCore\Coordinates
	endif
endif

; Text resources ---------------------------

[ResourceSectionHeader]
type = Buffer
format = R8_UINT
data = "Misc"

[ResourceOptionUnlit]
type = Buffer
format = R8_UINT
data = "Unlit"

[ResourceOptionHideUI]
type = Buffer
format = R8_UINT
data = "HideUI"

[ResourceOptionCoordinates]
type = Buffer
format = R8_UINT
data = "Coordinates"

; Section rendering ------------------------

[CommandListDrawSection]
; Section header
local $OffsetX = $\RCEFMenu\PanelPosX + ($\RCEFMenu\AnchorSizeX / 2)

z99 = 0
w99 = 1.6
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceSectionHeader
run = CommandList\RCEFMenu\DrawNormalText

$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)

; Option row bounds and starting position
$MinY = $\RCEFMenu\OffsetY
$MaxY = $MinY + $\RCEFText\TexelSize * w99
$OffsetX = $\RCEFMenu\PanelPosX + $\RCEFMenu\AnchorSizeX

; Option: Unlit view
w99 = 1.5
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceOptionUnlit
if $\RCEFCore\UnlitView == 0
	run = CommandList\RCEFMenu\DrawNormalText
else
	run = CommandList\RCEFMenu\DrawSelectedText
endif

$OffsetX = $OffsetX + (5 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_Unlit = x99
$MaxX_Unlit = $OffsetX

$OffsetX = $OffsetX + ($\RCEFMenu\PaddingX * 1.5)

; Option: Hide game UI
x99 = $OffsetX
Resource\RCEFText\Text = ref ResourceOptionHideUI
if $\RCEFCore\HideGameUI == 0
	run = CommandList\RCEFMenu\DrawNormalText
else
	run = CommandList\RCEFMenu\DrawSelectedText
endif

$OffsetX = $OffsetX + (6 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_HideUI = x99
$MaxX_HideUI = $OffsetX

$OffsetX = $OffsetX + ($\RCEFMenu\PaddingX * 1.5)

; Option: Coordinates
x99 = $OffsetX
Resource\RCEFText\Text = ref ResourceOptionCoordinates
if $\RCEFCore\Coordinates == 0
	run = CommandList\RCEFMenu\DrawNormalText
else
	run = CommandList\RCEFMenu\DrawSelectedText
endif

$OffsetX = $OffsetX + (11 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_Coordinates = x99
$MaxX_Coordinates = $OffsetX

; Leave spacing for the next menu section
$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)