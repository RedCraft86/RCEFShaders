; Foilage Culling Menu Section of RCEFShaders

namespace = RCEFMenu\RenderMode

; Hitbox state -----------------------------

[Constants]
global $MinY = 0
global $MaxY = 0

global $MinX_Off = 0
global $MaxX_Off = 0

global $MinX_NoFog = 0
global $MaxX_NoFog = 0

global $MinX_Unlit = 0
global $MaxX_Unlit = 0

; Click handling ---------------------------

[KeySelectMode]
condition = $\RCEFMenu\IsOpen
key = VK_LBUTTON
run = CommandListMakeSelection

[CommandListMakeSelection]
if cursor_y >= $MinY && cursor_y <= $MaxY
	if cursor_x >= $MinX_Off && cursor_x <= $MaxX_Off
		$\RCEFCore\RenderMode = 0
	elif cursor_x >= $MinX_NoFog && cursor_x <= $MaxX_NoFog
		$\RCEFCore\RenderMode = 1
	elif cursor_x >= $MinX_Unlit && cursor_x <= $MaxX_Unlit
		$\RCEFCore\RenderMode = 2
	endif
endif

; Text resources ---------------------------

[ResourceSectionHeader]
type = Buffer
format = R8_UINT
data = "Render Mode"

[ResourceOptionOff]
type = Buffer
format = R8_UINT
data = "Off"

[ResourceOptionNoFog]
type = Buffer
format = R8_UINT
data = "No-Fog"

[ResourceOptionUnlit]
type = Buffer
format = R8_UINT
data = "Unlit"

; Section rendering ------------------------

[CommandListDrawSection]
; Section header
local $OffsetX = $\RCEFMenu\PanelPosX + ($\RCEFMenu\AnchorSizeX / 2)

z99 = 0
w99 = 1.6
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceSectionHeader
run = CommandList\RCEFMenu\DrawNormalText

$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)

; Option row bounds and starting position
$MinY = $\RCEFMenu\OffsetY
$MaxY = $MinY + $\RCEFText\TexelSize * w99
$OffsetX = $\RCEFMenu\PanelPosX + $\RCEFMenu\AnchorSizeX

; Option: Off
w99 = 1.5
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceOptionOff
if $\RCEFCore\RenderMode == 0
	run = CommandList\RCEFMenu\DrawSelectedText
else
	run = CommandList\RCEFMenu\DrawNormalText
endif

$OffsetX = $OffsetX + (3 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_Off = x99
$MaxX_Off = $OffsetX

$OffsetX = $OffsetX + $\RCEFMenu\PaddingX

; Option: NoFog
x99 = $OffsetX
Resource\RCEFText\Text = ref ResourceOptionNoFog
if $\RCEFCore\RenderMode == 1
	run = CommandList\RCEFMenu\DrawSelectedText
else
	run = CommandList\RCEFMenu\DrawNormalText
endif

$OffsetX = $OffsetX + (6 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_NoFog = x99
$MaxX_NoFog = $OffsetX

$OffsetX = $OffsetX + $\RCEFMenu\PaddingX

; Option: Unlit
x99 = $OffsetX
Resource\RCEFText\Text = ref ResourceOptionUnlit
if $\RCEFCore\RenderMode == 2
	run = CommandList\RCEFMenu\DrawSelectedText
else
	run = CommandList\RCEFMenu\DrawNormalText
endif

$OffsetX = $OffsetX + (5 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_Unlit = x99
$MaxX_Unlit = $OffsetX

; Leave spacing for the next menu section
$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)