; Solid AIC Menu Section of RCEFShaders

namespace = RCEFMenu\AICVision

; Hitbox state -----------------------------

[Constants]
global $MinY = 0
global $MaxY = 0

global $MinX_FullRegions = 0
global $MaxX_FullRegions = 0

global $MinX_SolidTiles = 0
global $MaxX_SolidTiles = 0

; Click handling ---------------------------

[KeySelectMode]
condition = $\RCEFMenu\IsOpen
key = VK_LBUTTON
run = CommandListMakeSelection

[CommandListMakeSelection]
if $\EFMIv1\enable_mods
	if cursor_y >= $MinY && cursor_y <= $MaxY
		if cursor_x >= $MinX_FullRegions && cursor_x <= $MaxX_FullRegions
			$\RCEFCore\FullAICRegion = !$\RCEFCore\FullAICRegion
		elif cursor_x >= $MinX_SolidTiles && cursor_x <= $MaxX_SolidTiles
			$\RCEFCore\SolidAICTiles = !$\RCEFCore\SolidAICTiles
		endif
	endif
endif

; Text resources ---------------------------

[ResourceSectionHeader]
type = Buffer
format = R8_UINT
data = "AIC Vision"

[ResourceOptionRegion]
type = Buffer
format = R8_UINT
data = "Full-Regions"

[ResourceOptionTiles]
type = Buffer
format = R8_UINT
data = "Solid-Tiles"

; Section rendering ------------------------

[CommandListDrawSection]
; Section header
local $OffsetX = $\RCEFMenu\PanelPosX + ($\RCEFMenu\AnchorSizeX / 2)

z99 = 0
w99 = 1.6
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceSectionHeader
run = CommandList\RCEFMenu\DrawNormalText

$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)

; Option row bounds and starting position
$MinY = $\RCEFMenu\OffsetY
$MaxY = $MinY + $\RCEFText\TexelSize * w99
$OffsetX = $\RCEFMenu\PanelPosX + $\RCEFMenu\AnchorSizeX

; Option: Regions
w99 = 1.5
x99 = $OffsetX
y99 = $\RCEFMenu\OffsetY
Resource\RCEFText\Text = ref ResourceOptionRegion
if $\RCEFCore\FullAICRegion == 0
	run = CommandList\RCEFMenu\DrawNormalText
else
	run = CommandList\RCEFMenu\DrawSelectedText
endif

$OffsetX = $OffsetX + (12 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_FullRegions = x99
$MaxX_FullRegions = $OffsetX

$OffsetX = $OffsetX + ($\RCEFMenu\PaddingX * 1.5)

; Option: Tiles
x99 = $OffsetX
Resource\RCEFText\Text = ref ResourceOptionTiles
if $\RCEFCore\SolidAICTiles == 0
	run = CommandList\RCEFMenu\DrawNormalText
else
	run = CommandList\RCEFMenu\DrawSelectedText
endif

$OffsetX = $OffsetX + (11 * $\RCEFText\TexelSize * $\RCEFText\WidthMulti * w99 / $\RCEFLibrary\AspectRatio)

$MinX_SolidTiles = x99
$MaxX_SolidTiles = $OffsetX

; Leave spacing for the next menu section
$\RCEFMenu\OffsetY = $\RCEFMenu\OffsetY + ($\RCEFText\TexelSize * w99) + ($\RCEFMenu\PaddingY * $\RCEFLibrary\AspectRatio)