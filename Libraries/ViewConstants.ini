; Library for RCEFShaders

namespace = RCEFLibrary

; CameraCB: terrain ps-cb0 (45 float4 entries), camera position at entry 44.xyz.
; SceneCB: terrain ps-cb1 (160 float4 entries), containing lighting and fog data.
;          entry 135.xyz is the lighting-volume anchor; player tracking is unverified.

[Constants]
global $HasViewConstants = 0

[ResourceCameraCB]

[ResourceSceneCB]

; Implementation ---------------------------

[Present]
post $HasViewConstants = 0

[CommandListCaptureViewConst]
if !$HasViewConstants && ps-cb0 !== null && ps-cb1 !== null
	ResourceCameraCB = copy ps-cb0
	ResourceSceneCB = copy ps-cb1
	if ResourceCameraCB !== null && ResourceSceneCB !== null
		$HasViewConstants = 1
	endif
endif

