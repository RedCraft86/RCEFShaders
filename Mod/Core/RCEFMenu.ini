; Menu module of RCEFShaders

namespace = RCEFMenu

[Constants]
; Configurable
global persist $PanelPosX = 0.2
global persist $PanelPosY = 0.2
global $PanelSizeX = 0.3
global $PanelSizeY = 0.35
global $AnchorSizeX = 0.02
global $AnchorSizeY = 0.02
global $DividerSize = 0.002
global $PaddingX = 0.01
global $PaddingY = 0.01

; DO NOT configure these
global $IsOpen = 0
global $IsDragging = 0
global $CanDrag = 0
global $OffsetY = 0

[KeyOpenMenu]
key = VK_ALT VK_END
type = toggle
$IsOpen = 1

[KeyDragMenu]
condition = $IsOpen && $CanDrag
key = VK_LBUTTON
type = hold
$IsDragging = 1

[CommandListRender]
if $IsOpen && $\RCEFLibrary\HasValidViewport
	local $DragMaxX = $PanelPosX + $AnchorSizeX
	local $DragMaxY = $PanelPosY + ($AnchorSizeY * $\RCEFLibrary\AspectRatio)
	$CanDrag = cursor_x >= $PanelPosX && cursor_x <= $DragMaxX && cursor_y >= $PanelPosY && cursor_y <= $DragMaxY
	if $IsDragging
		$PanelPosX = cursor_x - ($AnchorSizeX / 2)
		$PanelPosY = cursor_y - ($AnchorSizeY / 2) * $\RCEFLibrary\AspectRatio

		if $PanelPosX > 1 - $AnchorSizeX
			$PanelPosX = 1 - $AnchorSizeX
		endif
		if $PanelPosX < 0
			$PanelPosX = 0
		endif

		if $PanelPosY > 1 - ($AnchorSizeY * $\RCEFLibrary\AspectRatio)
			$PanelPosY = 1 - ($AnchorSizeY * $\RCEFLibrary\AspectRatio)
		endif
		if $PanelPosY < 0
			$PanelPosY = 0
		endif
	endif

	$OffsetY = $PanelPosY

	local $savedX99 = x99
	local $savedY99 = y99
	local $savedZ99 = z99
	local $savedW99 = w99

	run = CustomShaderDrawBase
	run = CommandListDrawTitle
	run = CustomShaderDrawDivider
	run = CommandList\RCEFMenu\MapType\DrawSection
	run = CustomShaderDrawDivider
	run = CommandList\RCEFMenu\Volumes\DrawSection
	run = CustomShaderDrawDivider
	run = CommandList\RCEFMenu\Foliage\DrawSection
	run = CustomShaderDrawDivider
	run = CommandList\RCEFMenu\SolidAIC\DrawSection
	run = CustomShaderDrawDivider
	run = CommandList\RCEFMenu\Misc\DrawSection

	x99 = $savedX99
	y99 = $savedY99
	z99 = $savedZ99
	w99 = $savedW99
else
	$CanDrag = 0
endif

[ResourceColorWhite]
type = Buffer
data = R32_FLOAT 1 1 1 1

[ResourceColorBlack]
type = Buffer
data = R32_FLOAT 0 0 0 1

[ResourceColorYellow]
type = Buffer
data = R32_FLOAT 1 1 0 1

[ResourceColorBase]
type = Buffer
data = R32_FLOAT 0.08 0.08 0.08 0.75

[ResourceColorDivider]
type = Buffer
data = R32_FLOAT 0.5 0.5 0.5 1

[CustomShaderDrawDivider]
vs = Shaders\Draw2D.hlsl
ps = Shaders\Draw2D.hlsl
cs = null
ds = null
gs = null
hs = null
cull = none
depth_enable = false
stencil_enable = false
scissor_enable = false
depth_clip_enable = false
topology = triangle_strip
blend = ADD SRC_ALPHA INV_SRC_ALPHA
o0 = set_viewport no_view_cache bb
x99 = $PanelPosX
y99 = $OffsetY
z99 = $PanelSizeX
w99 = $DividerSize * $\RCEFLibrary\AspectRatio
vs-cb0 = null
ps-cb0 = ref ResourceColorDivider
ps-t1 = null
draw = 4, 0
ps-cb0 = null
$OffsetY = $OffsetY + w99 + ($PaddingY * $\RCEFLibrary\AspectRatio)

[CommandListDrawNormalText]
Resource\RCEFText\TextData = null
Resource\RCEFText\BackColor = null
Resource\RCEFText\TextColor = ref ResourceColorWhite
run = CommandList\RCEFText\PrintText

[CommandListDrawSelectedText]
Resource\RCEFText\TextData = null
Resource\RCEFText\BackColor = ref ResourceColorYellow
Resource\RCEFText\TextColor = ref ResourceColorBlack
run = CommandList\RCEFText\PrintText

[CustomShaderDrawBase]
vs = Shaders\Draw2D.hlsl
ps = Shaders\Draw2D.hlsl
cs = null
ds = null
gs = null
hs = null
cull = none
depth_enable = false
stencil_enable = false
scissor_enable = false
depth_clip_enable = false
topology = triangle_strip
blend = ADD SRC_ALPHA INV_SRC_ALPHA
o0 = set_viewport no_view_cache bb

x99 = $PanelPosX
y99 = $PanelPosY
z99 = $PanelSizeX
w99 = $PanelSizeY * $\RCEFLibrary\AspectRatio
vs-cb0 = null
ps-cb0 = ref ResourceColorBase
ps-t1 = null
draw = 4, 0
ps-cb0 = null

z99 = $AnchorSizeX
w99 = $AnchorSizeY * $\RCEFLibrary\AspectRatio
vs-cb0 = null
ps-cb0 = ref ResourceColorYellow
ps-t1 = null
draw = 4, 0
ps-cb0 = null

[ResourceMenuTitle]
type = Buffer
format = R8_UINT
data = "RCEFShaders 1.6.0-BETA 1"

[CommandListDrawTitle]
x99 = $PanelPosX + ($PanelSizeX / 2)
y99 = $PanelPosY + ($AnchorSizeY / 4) * $\RCEFLibrary\AspectRatio
z99 = 1
w99 = 1.8
Resource\RCEFText\Text = ref ResourceMenuTitle
Resource\RCEFText\TextColor = ref ResourceColorYellow
run = CommandList\RCEFText\PrintText

$OffsetY = $OffsetY + ($\RCEFText\TexelSize * w99) + ($PaddingY * $\RCEFLibrary\AspectRatio)