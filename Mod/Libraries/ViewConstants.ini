; Library for RCEFShaders

namespace = RCEFLibrary

; CameraCB: terrain ps-cb0 (45 float4 entries), camera position at entry 44.xyz.
; SceneCB: terrain ps-cb1 (157 float4 entries), containing lighting and fog data.
;          entry 132.xyz is the observed player anchor; read it directly.

[Constants]
global $HasViewConstants = 0

[ResourceCameraCB]

[ResourceSceneCB]

; Implementation ---------------------------

[Present]
post $HasViewConstants = 0

[CommandListCaptureViewConstants]
if !$HasViewConstants
	ResourceCameraCB = copy ps-cb0
	ResourceSceneCB = copy ps-cb1
	$HasViewConstants = 1
endif

